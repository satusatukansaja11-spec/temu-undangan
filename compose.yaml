services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temu}
      POSTGRES_USER: ${POSTGRES_USER:-temu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi password database yang kuat di .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_URL: ${APP_URL:?Isi URL domain HTTPS aplikasi}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-temu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-temu}
      REQUIRE_POSTGRES: "true"
      PG_SSL: "false"
      AUTO_MIGRATE: "false"
      DEMO_LOGIN: "false"
      TRUST_PROXY: ${TRUST_PROXY:-0}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      MAX_GALLERY_PHOTOS: ${MAX_GALLERY_PHOTOS:-200}
      MAX_EVENT_PHOTOS: ${MAX_EVENT_PHOTOS:-1000}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-30}
      MAX_EVENT_STORAGE_MB: ${MAX_EVENT_STORAGE_MB:-2048}
      MAX_EVENT_TRACKS: ${MAX_EVENT_TRACKS:-20}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    volumes:
      - media-data:/app/data
volumes:
  postgres-data:
  media-data:
